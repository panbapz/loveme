<script>
      // Cách 1: Quan sát cây DOM để xóa ngay khi Netlify vừa xuất hiện
      const observer = new MutationObserver(() => {
        const badge = document.getElementById('netlify-badge');
        if (badge) {
          badge.remove();
          observer.disconnect(); // Dừng quan sát sau khi đã xóa thành công
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      // Cách 2: Phòng ngừa thêm trường hợp tải chậm
      window.addEventListener('load', () => {
        const badge = document.getElementById('netlify-badge');
        if (badge) badge.remove();
      });
    </script>
